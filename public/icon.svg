<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#1e0a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Rounded background — safe for iOS/Android auto-masking -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="272" r="180" fill="none" stroke="url(#rim)" stroke-width="6" opacity="0.55"/>

  <!-- Crown -->
  <g transform="translate(256 130)" fill="url(#gold)">
    <path d="M -110 0 L -70 -55 L -35 -15 L 0 -75 L 35 -15 L 70 -55 L 110 0 L 95 45 L -95 45 Z"/>
    <circle cx="0" cy="-75" r="10" fill="#fef3c7"/>
    <circle cx="-70" cy="-55" r="7" fill="#fef3c7"/>
    <circle cx="70" cy="-55" r="7" fill="#fef3c7"/>
  </g>

  <!-- Big Q -->
  <g transform="translate(256 320)">
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <!-- Q tail -->
    <path d="M 38 38 L 88 88" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ARENA wordmark -->
  <text x="256" y="470" text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900" font-size="46"
    fill="url(#gold)" letter-spacing="6">ARENA</text>
</svg>
